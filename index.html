<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Screenshot Checker</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --ok: #22c55e;
      --warn: #f59e0b;
      --bad: #ef4444;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      padding: 24px;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    .header h1 {
      margin: 0 0 6px;
      font-size: 1.6rem;
    }

    .header p {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    @media (max-width: 640px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input[type="url"],
    input[type="password"],
    input[type="file"],
    input[type="number"],
    input[type="text"],
    select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
    }

    input:focus,
    select:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
      border-color: var(--accent);
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      font-size: 0.9rem;
      margin-bottom: 16px;
      cursor: pointer;
    }

    .checkbox-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 9px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: transparent;
      color: var(--text);
      font-size: 0.9rem;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .btn:hover {
      border-color: var(--accent);
    }

    .btn.active {
      background-color: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      font-weight: 600;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #0f172a;
      border: none;
      padding: 11px 18px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .action-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .status-text {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: 0.03em;
    }

    .badge.real {
      background-color: rgba(34, 197, 94, 0.2);
      color: var(--ok);
    }

    .badge.unverified,
    .badge.suspicious {
      background-color: rgba(245, 158, 11, 0.2);
      color: var(--warn);
    }

    .badge.fake {
      background-color: rgba(239, 68, 68, 0.2);
      color: var(--bad);
    }

    .result-box {
      margin: 0;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: #0b1120;
      color: #e2e8f0;
      font-size: 0.85rem;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>Payment Screenshot Checker</h1>
      <p>Verify payment screenshots or transaction IDs against your FastAPI service on Render.</p>
    </header>

    <section class="card">
      <div class="grid-2">
        <div class="field">
          <label for="baseUrl">Service URL</label>
          <input id="baseUrl" type="url" placeholder="https://your-app.onrender.com" />
        </div>
        <div class="field">
          <label for="apiKey">API Key (x-api-key)</label>
          <input id="apiKey" type="password" placeholder="Optional if API_KEY is empty" />
        </div>
      </div>
      <div class="action-row">
        <button id="healthBtn" class="btn" type="button">Check Health (/)</button>
        <span id="healthStatus" class="status-text">Ready</span>
      </div>
    </section>

    <section class="card">
      <div class="tabs">
        <button id="tabImage" class="btn active" type="button">Verify Screenshot</button>
        <button id="tabTxn" class="btn" type="button">Verify Transaction ID</button>
      </div>

      <form id="imageForm" action="/verify-image" method="post" enctype="multipart/form-data">
        <div class="field">
          <label for="receiptFile">Receipt Screenshot (PNG, JPG, max 8 MB)</label>
          <input id="receiptFile" name="file" type="file" accept="image/*" required />
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="imageAmount">Expected Amount (optional)</label>
            <input id="imageAmount" name="expected_amount" type="number" step="0.01" placeholder="e.g. 250.00" />
          </div>
          <div class="field">
            <label for="imageReceiver">Expected Receiver (optional)</label>
            <input id="imageReceiver" name="expected_receiver" type="text" placeholder="e.g. Receiver Name" />
          </div>
        </div>

        <label class="checkbox-label">
          <input id="registerReceipt" name="register" type="checkbox" checked />
          Save receipt to database to detect duplicates
        </label>

        <button class="btn-primary" type="submit">Analyze Screenshot</button>
      </form>

      <form id="txnForm" action="/verify-transaction" method="post" hidden>
        <div class="grid-2">
          <div class="field">
            <label for="txnId">Transaction ID</label>
            <input id="txnId" name="transaction_id" type="text" placeholder="e.g. TX1234567890" required />
          </div>
          <div class="field">
            <label for="providerSelect">Provider</label>
            <select id="providerSelect" name="provider">
              <option value="telebirr">telebirr</option>
              <option value="cbe">cbe</option>
              <option value="awash">awash</option>
              <option value="dashen">dashen</option>
              <option value="boa">boa</option>
              <option value="mpesa">mpesa</option>
            </select>
          </div>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="txnAmount">Expected Amount (optional)</label>
            <input id="txnAmount" name="expected_amount" type="number" step="0.01" placeholder="e.g. 250.00" />
          </div>
          <div class="field">
            <label for="txnReceiver">Expected Receiver (optional)</label>
            <input id="txnReceiver" name="expected_receiver" type="text" placeholder="e.g. Receiver Name" />
          </div>
        </div>

        <button class="btn-primary" type="submit">Verify Transaction</button>
      </form>
    </section>

    <section class="card">
      <div id="verdictBadge"></div>
      <pre id="resultOutput" class="result-box">Results will appear here.</pre>
    </section>
  </main>
</body>
</html>
